<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Segoe UI Variable Text, Arial, sans-serif">
  <title>An AI assistant reading a geotechnical report and creating a complete pile analysis, soil profile included, in the engineer's cloud project</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#171c45"/>
    </linearGradient>
    <linearGradient id="premium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f7ee6"/>
      <stop offset="0.55" stop-color="#c35bd0"/>
      <stop offset="1" stop-color="#f0388f"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8a9f6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(148,163,184,0.09)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#grid)"/>

  <!-- The assistant's conversation: generic, any assistant that takes a custom connector. -->
  <rect x="48" y="48" width="620" height="664" rx="20" fill="#121726" stroke="rgba(184,169,246,0.28)"/>
  <circle cx="84" cy="88" r="14" fill="url(#premium)"/>
  <path d="M84 79 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z" fill="#ffffff"/>
  <text x="108" y="84" font-size="16" font-weight="700" fill="#e2e8f0">Your AI assistant</text>
  <text x="108" y="104" font-size="12.5" fill="#a3b0c4">Connected to your cloud, signed in as you</text>
  <line x1="48" y1="128" x2="668" y2="128" stroke="rgba(148,163,184,0.18)"/>

  <!-- The engineer, with the report attached -->
  <rect x="236" y="146" width="408" height="106" rx="16" fill="#1f6f68"/>
  <rect x="256" y="162" width="190" height="26" rx="7" fill="rgba(255,255,255,0.14)"/>
  <path d="M266 168h9l4 4v11h-13z" fill="none" stroke="#ecfeff" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="286" y="180" font-size="12.5" fill="#ecfeff">Geotech report, B-2.pdf</text>
  <text x="256" y="212" font-size="14.5" fill="#ecfeff">Create the pile analysis for Pier 3 in Mill</text>
  <text x="256" y="234" font-size="14.5" fill="#ecfeff">Creek Overpass: 48 in shaft, 60 ft long.</text>

  <!-- Tool calls -->
  <g font-size="12.5" font-family="Cascadia Mono, Consolas, monospace">
    <rect x="72" y="270" width="250" height="30" rx="15" fill="rgba(184,169,246,0.12)" stroke="rgba(184,169,246,0.45)"/>
    <text x="90" y="290" fill="#d6ccff">get_model_schema · pile</text>
    <rect x="334" y="270" width="226" height="30" rx="15" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.55)"/>
    <text x="352" y="290" fill="#fcd34d">validate_model · 1 missing</text>
  </g>

  <!-- The assistant asks rather than guesses -->
  <rect x="72" y="316" width="468" height="84" rx="16" fill="#1c2233" stroke="rgba(148,163,184,0.22)"/>
  <text x="92" y="344" font-size="14.5" fill="#e2e8f0">I read five layers and the water table from B-2.</text>
  <text x="92" y="366" font-size="14.5" fill="#e2e8f0">The report gives no loads at the shaft's head. What are they?</text>
  <text x="92" y="388" font-size="12" fill="#a3b0c4">Missing inputs are asked for, never invented.</text>

  <rect x="300" y="418" width="344" height="58" rx="16" fill="#1f6f68"/>
  <text x="320" y="452" font-size="14.5" fill="#ecfeff">220 kip axial, 35 kip shear, 180 kip-ft.</text>

  <g font-size="12.5" font-family="Cascadia Mono, Consolas, monospace">
    <rect x="72" y="494" width="190" height="30" rx="15" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.55)"/>
    <text x="90" y="514" fill="#86efac">validate_model · ok</text>
    <rect x="274" y="494" width="176" height="30" rx="15" fill="rgba(45,212,191,0.12)" stroke="rgba(45,212,191,0.55)"/>
    <text x="292" y="514" fill="#5eead4">create_model · ok</text>
  </g>

  <rect x="72" y="540" width="512" height="100" rx="16" fill="#1c2233" stroke="rgba(148,163,184,0.22)"/>
  <text x="92" y="568" font-size="14.5" fill="#e2e8f0">Created Pier 3 in Mill Creek Overpass: five soil layers,</text>
  <text x="92" y="590" font-size="14.5" fill="#e2e8f0">the water table, the shaft, its section and the load case.</text>
  <text x="92" y="612" font-size="14.5" fill="#e2e8f0">Nothing has been run: check each layer against the</text>
  <text x="92" y="634" font-size="14.5" fill="#e2e8f0">report, then run it in PileAxis.</text>

  <rect x="72" y="656" width="572" height="38" rx="19" fill="#0e1320" stroke="rgba(148,163,184,0.22)"/>
  <text x="94" y="680" font-size="13.5" fill="#64748b">Ask your assistant…</text>

  <!-- The connector -->
  <path d="M668 380 C 720 380, 730 290, 790 290" fill="none" stroke="url(#wire)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M668 380 C 720 380, 730 560, 790 560" fill="none" stroke="url(#wire)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <rect x="682" y="362" width="96" height="36" rx="18" fill="#121726" stroke="rgba(45,212,191,0.6)"/>
  <text x="730" y="385" font-size="12.5" font-weight="600" fill="#5eead4" text-anchor="middle">MCP</text>

  <!-- The cloud: the new pile analysis and its soil profile -->
  <rect x="790" y="48" width="362" height="424" rx="20" fill="#f8fafc"/>
  <text x="818" y="84" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.2">YOUR CLOUD · MILL CREEK OVERPASS</text>
  <text x="818" y="112" font-size="18" font-weight="700" fill="#0f172a">Pier 3</text>
  <text x="818" y="134" font-size="12.5" fill="#64748b">Pile analysis · 48 in shaft, 60 ft · not run</text>
  <line x1="818" y1="150" x2="1124" y2="150" stroke="#e2e8f0"/>
  <text x="818" y="176" font-size="11.5" font-weight="700" fill="#64748b" letter-spacing="1">SOIL PROFILE</text>
  <text x="1124" y="176" font-size="11.5" font-weight="600" fill="#0369a1" text-anchor="end">Water table 8 ft</text>

  <!-- Layers: a strip coloured like the program's soil column, and each layer's p-y model and strength -->
  <g font-size="12.5">
    <rect x="818" y="188" width="18" height="40" fill="#a3a3a3"/>
    <rect x="818" y="228" width="18" height="48" fill="#8b6f47"/>
    <rect x="818" y="276" width="18" height="58" fill="#e0c071"/>
    <rect x="818" y="334" width="18" height="52" fill="#d4a94f"/>
    <rect x="818" y="386" width="18" height="60" fill="#7c8a99"/>
    <line x1="812" y1="240" x2="842" y2="240" stroke="#0369a1" stroke-width="2" stroke-dasharray="4 3"/>

    <text x="848" y="204" fill="#64748b">0–6 ft</text>
    <text x="910" y="204" fill="#0f172a" font-weight="600">Soft clay</text>
    <text x="1124" y="204" fill="#334155" text-anchor="end">Matlock · c<tspan font-size="9" dy="3">u</tspan><tspan dy="-3"> 0.4 ksf</tspan></text>
    <line x1="848" y1="228" x2="1124" y2="228" stroke="#e2e8f0"/>
    <text x="848" y="256" fill="#64748b">6–14 ft</text>
    <text x="910" y="256" fill="#0f172a" font-weight="600">Stiff clay</text>
    <text x="1124" y="256" fill="#334155" text-anchor="end">Reese · c<tspan font-size="9" dy="3">u</tspan><tspan dy="-3"> 1.6 ksf</tspan></text>
    <line x1="848" y1="276" x2="1124" y2="276" stroke="#e2e8f0"/>
    <text x="848" y="309" fill="#64748b">14–30 ft</text>
    <text x="910" y="309" fill="#0f172a" font-weight="600">Sand</text>
    <text x="1124" y="309" fill="#334155" text-anchor="end">Reese · φ 34°</text>
    <line x1="848" y1="334" x2="1124" y2="334" stroke="#e2e8f0"/>
    <text x="848" y="364" fill="#64748b">30–44 ft</text>
    <text x="910" y="364" fill="#0f172a" font-weight="600">Dense sand</text>
    <text x="1124" y="364" fill="#334155" text-anchor="end">API · φ 38°</text>
    <line x1="848" y1="386" x2="1124" y2="386" stroke="#e2e8f0"/>
    <text x="848" y="420" fill="#64748b">44–60 ft</text>
    <text x="910" y="420" fill="#0f172a" font-weight="600">Weak rock</text>
    <text x="1124" y="420" fill="#334155" text-anchor="end">q<tspan font-size="9" dy="3">u</tspan><tspan dy="-3"> 180 ksf</tspan></text>
  </g>
  <text x="818" y="458" font-size="12" fill="#64748b">Plus the pile, its section and the load case at its head.</text>

  <!-- What the program checks -->
  <rect x="790" y="496" width="362" height="216" rx="20" fill="#121726" stroke="rgba(148,163,184,0.22)"/>
  <text x="818" y="532" font-size="12" font-weight="700" fill="#b8a9f6" letter-spacing="1.2">THE SAME PROGRAM BEHIND IT</text>
  <g font-size="13.5" fill="#e2e8f0">
    <circle cx="826" cy="562" r="9" fill="#2f9e5a"/><polyline points="821.5,562 825,565.5 830.5,558.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="567">The Soil, Pile, Section and Loads checks</text>
    <circle cx="826" cy="596" r="9" fill="#2f9e5a"/><polyline points="821.5,596 825,599.5 830.5,592.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="601">Each layer's p-y model and its inputs</text>
    <circle cx="826" cy="630" r="9" fill="#2f9e5a"/><polyline points="821.5,630 825,633.5 830.5,626.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="635">Missing inputs reported, not guessed</text>
    <circle cx="826" cy="664" r="9" fill="#2f9e5a"/><polyline points="821.5,664 825,667.5 830.5,660.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="669">Saved unrun, in your name, for you to run</text>
  </g>
</svg>
